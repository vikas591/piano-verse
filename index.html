<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoVerse - Modern Interactive Music App</title>
    <script>
        // Load manifest only if on a web server to avoid CORS errors when opening as local file
        if (window.location.protocol.startsWith('http')) {
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'manifest.json';
            document.head.appendChild(link);
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="theme-color" content="#1a1c2c">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="app-container">
        <header>
        <div class="logo">
            <img src="assets/icon.png" alt="PianoVerse" id="main-logo">
        </div>
            <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </header>

        <main>
            <section class="control-panel glass">
                <div class="control-group">
                    <label>Octave</label>
                    <div class="segmented-control">
                        <button class="octave-btn" data-octave="1">Drums (1)</button>
                        <button class="octave-btn" data-octave="2">Low (2)</button>
                        <button class="octave-btn active" data-octave="3">Mid (3)</button>
                        <button class="octave-btn" data-octave="4">High (4)</button>
                        <button class="octave-btn" data-octave="5">Supra (5)</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Volume</label>
                    <div class="volume-slider-container">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.7">
                        <span id="volume-value">70%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Recording</label>
                    <div class="record-controls">
                        <button id="rec-btn" class="icon-btn" title="Start Recording">
                            <svg viewBox="0 0 24 24" width="20" height="20"><circle fill="currentColor" cx="12" cy="12" r="6"/></svg>
                        </button>
                        <button id="play-rec-btn" class="icon-btn" title="Play Recording" disabled>
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button id="save-rec-btn" class="icon-btn" title="Save Recording" disabled>
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                        </button>
                        <button id="clear-rec-btn" class="icon-btn" title="Clear Recording">
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Song Mode</label>
                    <div class="song-controls-container">
                        <select id="song-select" class="glass-select">
                            <option value="none">Choose a song...</option>
                            <option value="twinkle">Twinkle Twinkle</option>
                            <option value="jingle">Jingle Bells</option>
                            <option value="fur-elise">Für Elise</option>
                            <option value="munbe-vaa">Munbe Vaa</option>
                            <option value="kannaana-kanney">Kannaana Kanney</option>
                            <option value="vaseegara">Vaseegara</option>
                            <option value="ennodu-nee">Ennodu Nee Irundhaal</option>
                            <option value="nila-kaigirathu">Nila Kaigirathu</option>
                            <option value="pookkalae">Pookkalae Sattru Oyivedungal</option>
                        </select>
                        <button id="song-play-btn" class="icon-btn" title="Play Song">
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Drum Beats</label>
                    <div class="beats-container">
                        <select id="beat-select" class="glass-select">
                            <option value="none">None</option>
                            <option value="pop">Pop</option>
                            <option value="rock">Rock</option>
                            <option value="techno">Techno</option>
                            <option value="folk">Tamil Folk</option>
                            <option value="disco">Disco</option>
                            <option value="retro">80s Retro</option>
                            <option value="kuthu">Fast Kuthu</option>
                        </select>
                        <button id="beat-toggle" class="icon-btn" title="Start/Stop Beat">
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="control-group toggle-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="metronome-toggle">
                        <span class="label-text">Metronome</span>
                    </label>
                    <input type="number" id="bpm-input" value="120" min="40" max="240">
                </div>
            </section>

            <section class="piano-wrapper">
                <div id="piano" class="piano-keyboard">
                    <!-- Keys will be generated by JS to allow easy octave switching -->
                </div>
                <div class="note-display glass">
                    <span id="current-note">-</span>
                </div>
            </section>

            <section id="recordings-library" class="glass recordings-library">
                <label>Saved Recordings</label>
                <div id="recordings-list" class="recordings-list">
                    <p class="empty-msg">No recordings saved yet.</p>
                </div>
            </section>
        </main>

        <footer>
            <div class="shortcuts-hint glass">
                <p>Use keys <span>A S D F G H J</span> for White Keys &nbsp; | &nbsp; <span>W E T Y U</span> for Black Keys</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
